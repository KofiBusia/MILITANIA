{% extends 'base.html' %}
{% block title %}Change Password — Militania{% endblock %}
{% block content %}
<div class="page-header"><div><h1>Change Password</h1><p>Update the password for your portfolio login.</p></div></div>
<div class="card" style="max-width:460px;">
  <form method="POST">
    <div class="form-group"><label>New Password</label><input type="password" name="new_password" minlength="6" required></div>
    <div class="form-group"><label>Confirm New Password</label><input type="password" name="confirm_password" minlength="6" required></div>
    <button type="submit" class="btn btn-primary full-width">Save New Password</button>
  </form>
</div>
{% endblock %}
