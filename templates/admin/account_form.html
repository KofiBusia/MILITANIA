{% extends 'base.html' %}
{% block title %}New Account — Militania{% endblock %}
{% block content %}
<div class="page-header"><div><h1>New Account</h1></div><a href="{{ url_for('admin.accounts') }}" class="btn btn-secondary">← Back</a></div>
<div class="card" style="max-width:700px;">
  <form method="POST">
    <div class="form-grid-2">
      <div class="form-group"><label>Full Name *</label><input type="text" name="full_name" required></div>
      <div class="form-group"><label>Email</label><input type="email" name="email"></div>
      <div class="form-group"><label>Phone *</label><input type="text" name="phone" required></div>
      <div class="form-group"><label>Country</label><input type="text" name="country"></div>
      <div class="form-group"><label>Account Type</label>
        <select name="account_type"><option>Individual</option><option>Corporate</option><option>Joint</option></select>
      </div>
      <div class="form-group"><label>Risk Profile</label>
        <select name="risk_profile"><option>Conservative</option><option selected>Moderate</option><option>Aggressive</option></select>
      </div>
      <div class="form-group" style="grid-column:1/-1;"><label>Investment Objective</label><input type="text" name="investment_objective"></div>
      <div class="form-group" style="grid-column:1/-1;"><label>Address</label><input type="text" name="address"></div>
    </div>
    <button type="submit" class="btn btn-primary">Create Account</button>
  </form>
</div>
{% endblock %}
