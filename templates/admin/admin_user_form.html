{% extends 'base.html' %}
{% block title %}Add Staff — Militania{% endblock %}
{% block content %}
<div class="page-header"><div><h1>Add Staff Member</h1></div><a href="{{ url_for('admin.admin_users') }}" class="btn btn-secondary">← Back</a></div>
<div class="card" style="max-width:600px;">
  <form method="POST">
    <div class="form-group"><label>Full Name *</label><input type="text" name="full_name" required></div>
    <div class="form-group"><label>Email *</label><input type="email" name="email" required></div>
    <div class="form-group"><label>Role *</label>
      <select name="role" required>
        {% for key, info in roles.items() %}{% if key != 'SUPER_ADMIN' %}<option value="{{ key }}">{{ info.label }}</option>{% endif %}{% endfor %}
      </select>
    </div>
    <div class="form-group"><label>Password *</label>
      <input type="password" name="password" required placeholder="Min. 10 chars, upper, lower, number, symbol">
    </div>
    <button type="submit" class="btn btn-primary">Create Staff Account</button>
  </form>
</div>
{% endblock %}
